name: Build Vime NPU image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: vime-npu-image-publish
  cancel-in-progress: false

env:
  IMAGE: quay.io/ascend/vime
  UPSTREAM_REPOSITORY: vllm-project/vime
  UPSTREAM_BRANCH: ascend

jobs:
  build-and-publish:
    name: Build and publish linux/arm64 (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a3
            target_tag: vime-latest
            base_image_tag: v0.22.1rc1-a3
            soc_version: ascend910_9391
          - variant: a2
            target_tag: vime-a2-latest
            base_image_tag: v0.22.1rc1
            soc_version: ascend910b1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BASE_IMAGE_TAG: ${{ matrix.base_image_tag }}
      SOC_VERSION: ${{ matrix.soc_version }}
      TARGET_TAG: ${{ matrix.target_tag }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve upstream HEAD
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(
            gh api "repos/${UPSTREAM_REPOSITORY}/branches/${UPSTREAM_BRANCH}" \
              --jq '.commit.sha'
          )"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream commit: ${source_sha}" >&2
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Upstream ${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH} is ${source_sha}"

      - name: Decide whether a build is needed
        id: plan
        env:
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: |
          set -euo pipefail
          remote_base_image_tag=""
          remote_revision=""
          remote_soc_version=""
          if image_json="$(
            docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" \
              --format '{{json .Image}}' 2>/dev/null
          )"; then
            remote_revision="$(
              jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' \
                <<< "${image_json}"
            )"
            remote_base_image_tag="$(
              jq -r '.config.Labels["io.vime.base-image-tag"] // empty' \
                <<< "${image_json}"
            )"
            remote_soc_version="$(
              jq -r '.config.Labels["io.vime.soc-version"] // empty' \
                <<< "${image_json}"
            )"
          fi

          if [[ "${remote_revision}" == "${SOURCE_SHA}" && \
                "${remote_base_image_tag}" == "${BASE_IMAGE_TAG}" && \
                "${remote_soc_version}" == "${SOC_VERSION}" ]]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "${TARGET_TAG} already matches ${SOURCE_SHA}, ${BASE_IMAGE_TAG}, ${SOC_VERSION}; skipping."
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "${TARGET_TAG} is stale:"
            echo "  revision: ${remote_revision:-unknown} -> ${SOURCE_SHA}"
            echo "  base tag: ${remote_base_image_tag:-unknown} -> ${BASE_IMAGE_TAG}"
            echo "  SOC: ${remote_soc_version:-unknown} -> ${SOC_VERSION}"
          fi

      - name: Check out upstream commit
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vllm-project/vime
          ref: ${{ steps.upstream.outputs.source_sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the upstream Dockerfile
        if: steps.plan.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          if grep -Eq '^ARG VIME_COMMIT(=|$)' upstream/docker/Dockerfile.npu; then
            echo "Upstream Dockerfile already supports VIME_COMMIT."
          else
            git -C upstream apply --check ../patches/pin-vime-commit.patch
            git -C upstream apply ../patches/pin-vime-commit.patch
          fi

          if grep -Eq '^ENV SOC_VERSION=' upstream/docker/Dockerfile.npu; then
            echo "Upstream Dockerfile already persists SOC_VERSION."
          else
            git -C upstream apply --check ../patches/persist-soc-version.patch
            git -C upstream apply ../patches/persist-soc-version.patch
          fi
          git -C upstream diff --check

      - name: Reclaim runner disk space
        if: steps.plan.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift
          docker system prune --all --force --volumes || true
          df -h /

      - name: Set up Docker Buildx
        if: steps.plan.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay
        if: steps.plan.outputs.should_build == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${QUAY_USERNAME}" || -z "${QUAY_TOKEN}" ]]; then
            echo "QUAY_USERNAME and QUAY_TOKEN repository secrets are required." >&2
            exit 1
          fi
          printf '%s' "${QUAY_TOKEN}" | \
            docker login quay.io --username "${QUAY_USERNAME}" --password-stdin

      - name: Build and push by digest
        if: steps.plan.outputs.should_build == 'true'
        id: build
        env:
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/vime-build-metadata.json"

          cache_args=()
          if docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" >/dev/null 2>&1; then
            cache_args+=(--cache-from "type=registry,ref=${IMAGE}:${TARGET_TAG}")
          fi

          docker buildx build \
            --platform linux/arm64 \
            --file upstream/docker/Dockerfile.npu \
            --build-arg "BASE_IMAGE_TAG=${BASE_IMAGE_TAG}" \
            --build-arg "SOC_VERSION=${SOC_VERSION}" \
            --build-arg "VIME_COMMIT=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${UPSTREAM_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "io.vime.base-image-tag=${BASE_IMAGE_TAG}" \
            --label "io.vime.soc-version=${SOC_VERSION}" \
            --cache-to type=inline \
            "${cache_args[@]}" \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${metadata_file}" \
            upstream

          digest="$(jq -r '."containerimage.digest" // empty' "${metadata_file}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Built ${IMAGE}@${digest} for ${TARGET_TAG} from ${SOURCE_SHA}"

      - name: Verify upstream HEAD before promotion
        if: steps.plan.outputs.should_build == 'true'
        id: promote
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha="$(
            gh api "repos/${UPSTREAM_REPOSITORY}/branches/${UPSTREAM_BRANCH}" \
              --jq '.commit.sha'
          )"
          source_sha="${SOURCE_SHA}"
          if [[ "${current_sha}" != "${source_sha}" ]]; then
            echo "Skip stale promotion: upstream moved from ${source_sha} to ${current_sha}."
            echo "promoted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}@${BUILD_DIGEST}"
          echo "promoted=true" >> "${GITHUB_OUTPUT}"

      - name: Verify published image
        if: steps.promote.outputs.promoted == 'true'
        env:
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: |
          set -euo pipefail
          image_json="$(
            docker buildx imagetools inspect "${IMAGE}:${TARGET_TAG}" \
              --format '{{json .Image}}'
          )"
          architecture="$(jq -r '.architecture' <<< "${image_json}")"
          base_image_tag="$(
            jq -r '.config.Labels["io.vime.base-image-tag"] // empty' \
              <<< "${image_json}"
          )"
          revision="$(
            jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' \
              <<< "${image_json}"
          )"
          soc_version="$(
            jq -r '.config.Labels["io.vime.soc-version"] // empty' \
              <<< "${image_json}"
          )"
          runtime_soc_version="$(
            jq -r '[.config.Env[] | select(startswith("SOC_VERSION="))][0] // "" | sub("^SOC_VERSION="; "")' \
              <<< "${image_json}"
          )"
          [[ "${architecture}" == "arm64" ]]
          [[ "${revision}" == "${SOURCE_SHA}" ]]
          [[ "${base_image_tag}" == "${BASE_IMAGE_TAG}" ]]
          [[ "${soc_version}" == "${SOC_VERSION}" ]]
          [[ "${runtime_soc_version}" == "${SOC_VERSION}" ]]
          echo "Published ${IMAGE}:${TARGET_TAG} (${architecture}, ${revision}, ${SOC_VERSION})"

      - name: Log out of Quay
        if: always() && steps.plan.outputs.should_build == 'true'
        run: docker logout quay.io || true

name: Tag Vime latest with commit
run-name: Tag Vime latest (${{ inputs.variant }}, publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which existing Vime latest images to tag
        required: true
        type: choice
        default: all
        options:
          - all
          - a2
          - a3
      publish:
        description: Create commit tags (false previews the current latest digests only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vime-commit-tagging
  cancel-in-progress: false

jobs:
  tag:
    name: Tag existing Vime images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tag script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check registry tooling
        run: docker buildx version

      - name: Log in to Quay
        if: inputs.publish
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          set -euo pipefail
          : "${QUAY_USERNAME:?Configure the QUAY_USERNAME repository secret}"
          : "${QUAY_TOKEN:?Configure the QUAY_TOKEN repository secret}"
          printf '%s' "${QUAY_TOKEN}" | \
            docker login quay.io --username "${QUAY_USERNAME}" --password-stdin

      - name: Snapshot latest and add commit tags
        env:
          VARIANT: ${{ inputs.variant }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(--variant "${VARIANT}")
          if [[ "${PUBLISH}" == "true" ]]; then
            args+=(--publish)
          fi
          python3 scripts/tag_vime_commit.py "${args[@]}"

      - name: Log out of Quay
        if: always() && inputs.publish
        run: docker logout quay.io
